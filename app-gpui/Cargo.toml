[package]
name = "quantframe-gpui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Quantframe desktop app, GPUI front end"

[workspace]

[[bin]]
name = "quantframe"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["font-kit", "x11", "wayland"] }
gpui-component = "=0.10.0"
gpui-kit-assets = "=0.10.0"

[profile.release]
opt-level = 2
debug = false
strip = true
