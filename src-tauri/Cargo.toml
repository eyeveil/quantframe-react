[package]
name = "Quantframe"
version = "1.6.31"
description = "Quantframe"
authors = ["Kenya-DK", "eyeveil", "Quantframe contributors"]
license = ""
repository = "https://github.com/eyeveil/quantframe-react"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2.9.0", optional = true }

[features]
default = ["tauri"]
tauri = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-fs",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-http",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-shell",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-os",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-updater",
]

[[bin]]
name = "Quantframe"
path = "src/main.rs"
required-features = ["tauri"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]

# Tauri dependencies
tauri = { version = "2", features = [ "protocol-asset", "tray-icon"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-http = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-notification = { version = "2.0.0", optional = true }
tauri-plugin-os = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2.3.0", optional = true }
# Other dependencies
dirs = "6"
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["std"] }
reqwest = { version = "0.12.19", features = ["json", "gzip", "deflate"] }
tokio = {version =  "1.45.1", features = ["full"] }
regex = "1.9.1"
chrono = "0.4"
zip = "0.6"
sha256 = "1.5.0"
uuid = { version = "1.19.0",features = ["v4"] }
tract-onnx = "0.21"
# wf-market = { path = "C:/Users/Kenya/Desktop/Andet/Coding/Warframe/wf-market" }
wf-market = { git = "https://github.com/KibbeWater/wf-market", rev = "1d9f79aa80406acc6bc8e30878e499ebf75d5409" }

# Database dependencies
migration = { path = "./migration" }
service = { path = "./service" }
entity = { path = "./entity" }
qf_api = { path = "./qf_api" }
utils = { path = "./utils" }

[workspace]
members = [".", "qf_api", "service", "entity", "migration", "utils"]
